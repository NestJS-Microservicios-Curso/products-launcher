services:
  nats-server:
    attach: true
    image: nats:2.10-alpine
    container_name: nats_server
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  orders-db:
    attach: false
    image: postgres:16.2
    container_name: orders_database
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER:?ORDERS_DB_USER is required}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}
      POSTGRES_DB: ordersdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ORDERS_DB_USER:?ORDERS_DB_USER is required} -d ordersdb",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-db:
    attach: false
    image: mongo:7.0.0
    container_name: auth_database
    entrypoint: ["/usr/local/bin/auth-db-entrypoint.sh"]
    command:
      [
        "mongod",
        "--quiet",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--keyFile",
        "/data/db/keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      MONGO_INITDB_DATABASE: authdb
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-27017}:27017"
    volumes:
      - auth_db_data:/data/db
      - ./scripts/auth-db-entrypoint.sh:/usr/local/bin/auth-db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/27017'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-db-init:
    attach: false
    image: mongo:7.0.0
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    volumes:
      - ./scripts/auth-db-init.sh:/usr/local/bin/auth-db-init.sh:ro
    command: ["bash", "/usr/local/bin/auth-db-init.sh"]
    restart: "no"

  products-ms:
    attach: true
    build:
      context: ./products-microservice
      dockerfile: Dockerfile
      target: runner
    image: "${IMAGE_REGISTRY_GC_URL:+${IMAGE_REGISTRY_GC_URL}/}\
      products-microservice"
    container_name: products_microservice
    environment:
      DATABASE_URL: "file:/usr/src/app/prisma/data/dev.db"
      NATS_SERVERS: "nats://nats-server:4222"
    volumes:
      - products_db_data:/usr/src/app/prisma/data
    depends_on:
      - nats-server
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  orders-ms:
    attach: true
    build:
      context: ./orders-microservice
      dockerfile: Dockerfile
      target: runner
    image: "${IMAGE_REGISTRY_GC_URL:+${IMAGE_REGISTRY_GC_URL}/}\
      orders-microservice"
    container_name: orders_microservice
    environment:
      DATABASE_URL: "postgresql://\
        ${ORDERS_DB_USER:?ORDERS_DB_USER is required}:\
        ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}\
        @orders-db:5432/ordersdb?schema=\
        public"
      NATS_SERVERS: "nats://nats-server:4222"
    depends_on:
      orders-db:
        condition: service_healthy
      nats-server:
        condition: service_started
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  payments-ms:
    attach: true
    build:
      context: ./payments-microservice
      dockerfile: Dockerfile
      target: runner
    image: "${IMAGE_REGISTRY_GC_URL:+${IMAGE_REGISTRY_GC_URL}/}\
      payments-microservice"
    container_name: payments_microservice
    environment:
      NATS_SERVERS: "nats://nats-server:4222"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      STRIPE_WEBHOOK_SIGNATURE_SECRET: ${STRIPE_WEBHOOK_SIGNATURE_SECRET}
    depends_on:
      - nats-server
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-ms:
    attach: true
    build:
      context: ./auth-microservice
      dockerfile: Dockerfile
      target: runner
    image: "${IMAGE_REGISTRY_GC_URL:+${IMAGE_REGISTRY_GC_URL}/}\
      auth-microservice"
    container_name: auth_microservice
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      NATS_SERVERS: "nats://nats-server:4222"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-db-init:
        condition: service_completed_successfully
      nats-server:
        condition: service_started
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client-gateway:
    attach: true
    build:
      context: ./client-gateway
      dockerfile: Dockerfile
      target: runner
    image: "${IMAGE_REGISTRY_GC_URL:+${IMAGE_REGISTRY_GC_URL}/}\
      client-gateway"
    container_name: client_gateway
    ports:
      - "${CLIENT_GATEWAY_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NATS_SERVERS: "nats://nats-server:4222"
    depends_on:
      - nats-server
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  orders_db_data:
  products_db_data:
  auth_db_data:
