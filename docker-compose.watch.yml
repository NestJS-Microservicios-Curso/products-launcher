    command: npm run start:dev
    develop:
      watch:
        - path: ./payments-microservice/src
          target: /usr/src/app/src
          action: sync
        - path: ./payments-microservice/package.json
          target: /usr/src/app/package.json
          action: rebuild

  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: Dockerfile
      target: dev
    command: npm run start:dev
    develop:
      watch:
        - path: ./client-gateway/src
          target: /usr/src/app/src
          action: sync
        - path: ./client-gateway/package.json
          target: /usr/src/app/package.json
          action: rebuild
