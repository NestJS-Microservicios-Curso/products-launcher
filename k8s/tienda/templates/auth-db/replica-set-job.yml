apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init-replica-set
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: auth-db-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: init-replica-set
          image: mongo:7.0.0

          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: mongo_user

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: mongo_password

          command:
            - sh
            - -c
            - |
              set -eu
              end_time=$(($(date +%s) + 240))
              mongo_host="auth-db-0.auth-db-headless.default.svc."
              mongo_host="${mongo_host}cluster.local:27017"

              while ! mongosh --host "$mongo_host" \
                --username "$MONGO_USER" \
                --password "$MONGO_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --eval "db.adminCommand('ping')" >/dev/null 2>&1
              do
                if [ "$(date +%s)" -ge "$end_time" ]; then
                          echo "Timed out waiting for authenticated MongoDB" \
                            "at $mongo_host" >&2
                  exit 1
                fi
                echo "Waiting for authenticated MongoDB..."
                sleep 3
              done

              mongosh --host "$mongo_host" \
                --username "$MONGO_USER" \
                --password "$MONGO_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --eval '
                  try {
                    const status = rs.status();
                    print("Replica set already initialized");
                    printjson(status.members);
                  } catch (statusError) {
                    if (statusError.code === 94) {
                      try {
                        rs.initiate({
                          _id: "rs0",
                          members: [
                            {
                              _id: 0,
                                  host:
                                    "auth-db-0.auth-db-headless.default.svc." +
                                    "cluster.local:27017"
                            }
                          ]
                        });
                        print("Replica set initialized");
                      } catch (initError) {
                        if (initError.code === 23) {
                          print("Replica set was already initialized");
                        } else {
                          throw initError;
                        }
                      }
                    } else if (statusError.code === 93) {
                          const expectedMember =
                            "auth-db-0.auth-db-headless.default.svc." +
                            "cluster.local:27017";
                          console.error(
                            "Invalid persisted replica-set config (code 93): " +
                            "this server is not a valid member. " +
                            "Expected member host is " + expectedMember +
                            ". Inspect and recover the existing " +
                            "config; automatic initiation/" +
                            "reconfiguration is disabled."

                      );
                      quit(1);
                    } else {
                      throw statusError;
                    }
                  }
                '

              while ! mongosh --host "$mongo_host" \
                --username "$MONGO_USER" \
                --password "$MONGO_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' \
                >/dev/null 2>&1
              do
                if [ "$(date +%s)" -ge "$end_time" ]; then
                          echo "Timed out waiting for auth-db rs0 at" \
                            "$mongo_host to become writable primary" >&2
                  exit 1
                fi
                    echo "Waiting for auth-db replica set rs0 to become" \
                      "writable primary..."
                sleep 3
              done

              echo "auth-db replica set rs0 is writable"
