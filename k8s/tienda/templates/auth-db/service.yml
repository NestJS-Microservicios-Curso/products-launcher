apiVersion: v1
kind: Service
metadata:
  name: auth-db
  labels:
    app: auth-db
spec:
  type: ClusterIP
  selector:
    app: auth-db
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: auth-db-headless
  labels:
    app: auth-db
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: auth-db
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: 27017
