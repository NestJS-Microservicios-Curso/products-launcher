apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-microservice
  labels:
    app: auth-microservice
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-microservice

  template:
    metadata:
      labels:
        app: auth-microservice

    spec:
      containers:
        - name: auth-microservice
          image: europe-west9-docker.pkg.dev/nestjs-microservices-506615/image-registry/auth-microservice

          env:
            - name: NATS_SERVERS
              value: nats://nats

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: database_url

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt_secret

          resources: {}
